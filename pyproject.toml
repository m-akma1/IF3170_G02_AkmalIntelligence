[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uma-ai"
version = "0.0.1"
description = "IF3170 Project I: Local search to determine the most optimal package loading configuration for a container truck."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Muhammad Akmal", email = "13524099@std.stei.itb.ac.id" },
    { name = "Dzaki Ahmad Al Hussainy", email = "13524084@std.stei.itb.ac.id" },
    { name = "Moreno Syawali Ganda Sugita", email = "13524096@std.stei.itb.ac.id" }
]
keywords = ["ai", "local-search", "knapsack"]

dependencies = [
  "viser"
]

[project.optional-dependencies]
project = []
dev = [
  "pytest",
  "ruff"
]

[tool.hatch.build.targets.wheel]
packages = ["src/uma_ai"]